<style>
:root{--bg:#fffdf7;--fg:#161616;--muted:#4a4a4a;--card:#f2eee3;--line:#d8d0bc;--link:#0848a0;--accent:#0a6a3a;--accent-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f3f3f3;--muted:#c4c4c4;--card:#1d1d1d;--line:#3a3a3a;--link:#9cc9ff;--accent:#3fb872;--accent-fg:#06180d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1.25rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
.wrap{max-width:44rem;margin:0 auto;padding:0 16px}
header{border-bottom:2px solid var(--line);padding:20px 0 12px}
.brand{margin:0;font-weight:800;font-size:1.15rem;color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px;font-size:1.05rem}
h1{font-size:2rem;line-height:1.2;margin:28px 0 10px}
h2{font-size:1.5rem;line-height:1.25;margin:40px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:1.25rem;margin:24px 0 4px}
a{color:var(--link);text-underline-offset:3px;overflow-wrap:anywhere}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lead{font-size:1.35rem}
.muted{color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin:20px 0}
ul,ol{padding-left:1.4em}li{margin:6px 0}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px;margin:6px 0}
footer{border-top:2px solid var(--line);margin-top:48px;padding:20px 0 40px;font-size:1.05rem;color:var(--muted)}
@media (max-width:480px){body{font-size:1.15rem}h1{font-size:1.7rem}h2{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <!-- APP NAME: this is the only place on this page. Change the text below to rename. -->

</header>

<main>
<h1>Coming soon to Google Play</h1>

</footer>
</div>
</body>
</html>
